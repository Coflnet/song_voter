name: Android release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true
      - run: flutter pub get --enforce-lockfile && flutter analyze && flutter test
      - name: Configure signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE" && test -n "$PASSWORD"
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > /tmp/songvoter-release.jks
          printf 'storeFile=/tmp/songvoter-release.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=songvoter\n' "$PASSWORD" "$PASSWORD" > android/key.properties
      - run: flutter build apk --release --no-pub
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          cp build/app/outputs/flutter-apk/app-release.apk songvoter.apk
          sha256sum songvoter.apk > songvoter.apk.sha256
          gh release create "v$VERSION" songvoter.apk songvoter.apk.sha256 --target "$GITHUB_SHA" --title "SongVoter $VERSION" --generate-notes
      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties /tmp/songvoter-release.jks
