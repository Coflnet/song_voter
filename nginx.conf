server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location = /health { access_log off; return 200 'ok'; }
    location /api/ {
        proxy_pass http://songvoter:4200;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /downloads/songvoter.apk {
        return 302 https://github.com/Coflnet/song_voter/releases/latest/download/songvoter.apk;
    }
    location = /index.html { add_header Cache-Control "no-store"; }
    location = /flutter_bootstrap.js { add_header Cache-Control "no-store"; }
    location / { try_files $uri $uri/ /index.html; }
}
